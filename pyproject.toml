[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "freeagent-football"
version = "0.1.0"
description = "Displacement-aware football transfer research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<2", "streamlit>=1.40,<2", "plotly>=5.24,<7", "requests>=2.32,<3", "pyyaml>=6,<7", "joblib>=1.4,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
freeagent = "freeagent.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
